model_list:
  # Go subscription: bounded coding tasks, with results checked by tests/review.
  # Clients must send a stable x-litellm-session-id per conversation;
  # the native Go provider forwards it as x-opencode-session.
  - model_name: coding-cheap
    litellm_params:
      model: opencode_go/deepseek-v4.1-flash
      api_key: os.environ/OPENCODE_GO_API_KEY
      extra_headers:
        User-Agent: env-coding-gateway/1.0

  # OpenCode PAYG: default for implementation, debugging, planning, and review.
  - model_name: coding-default
    litellm_params:
      model: openai/gpt-6.1-sol
      api_base: https://opencode.ai/inference/openai/v1
      api_key: os.environ/OPENCODE_API_KEY
    model_info:
      mode: responses

  # OpenCode PAYG: explicitly selected escalation; no automatic paid fallbacks.
  - model_name: coding-powerful
    litellm_params:
      model: anthropic/claude-opus-5-5
      api_base: https://opencode.ai/inference/anthropic
      api_key: os.environ/OPENCODE_API_KEY

general_settings:
  disable_env_credential_login: true
  master_key: os.environ/LITELLM_MASTER_KEY
