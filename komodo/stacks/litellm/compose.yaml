services:
  open-webui:
    image: ${OPENWEBUI_IMAGE:-ghcr.io/open-webui/open-webui:v0.13.0}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_PORT}:8080"
    volumes:
      - ${OPENWEBUI_DATA_PATH}:/app/backend/data
    environment:
      - OPENAI_API_BASE_URL=http://litellm:4000/v1
      - OPENAI_API_KEY=${OPENWEBUI_LITELLM_API_KEY:?required}
      - ENABLE_OLLAMA_API=false
      - WEBUI_SECRET_KEY=${OPENWEBUI_SECRET_KEY:?required}
      - ENABLE_WEB_SEARCH=true
      - WEB_SEARCH_ENGINE=searxng
      - SEARXNG_QUERY_URL=http://searxng:8080/search
      - WEB_SEARCH_RESULT_COUNT=${OPENWEBUI_WEB_SEARCH_RESULT_COUNT:-3}
      - WEB_SEARCH_CONCURRENT_REQUESTS=${OPENWEBUI_WEB_SEARCH_CONCURRENT_REQUESTS:-2}
      - TZ=${TZ}
    depends_on:
      - litellm

  searxng:
    image: ${SEARXNG_IMAGE:-docker.io/searxng/searxng:2026.11.2-cccbc9e15@sha256:892ed5710603e38f9dc201e6a0b2f3f14dbdb8108edcadac30e55b165c979fb7}
    container_name: searxng
    restart: unless-stopped
    volumes:
      - ${SEARXNG_CONFIG_PATH:-./config/searxng/settings.yml}:/etc/searxng/settings.yml:ro
      - ${SEARXNG_DATA_PATH}:/var/cache/searxng
    environment:
      - SEARXNG_SECRET=${SEARXNG_SECRET:?required}
      - SEARXNG_BASE_URL=http://searxng:8080/
      - TZ=${TZ}
    healthcheck:
      test:
        - CMD
        - /usr/local/searxng/.venv/bin/python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

  litellm:
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.109.0-dev.2}
    container_name: litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "${LITELLM_PORT}:4000"
    volumes:
      - ${LITELLM_CONFIG_PATH:-./config/config.yaml}:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?required}
      - LITELLM_SALT_KEY=${LITELLM_SALT_KEY:?required}
      - DATABASE_URL=postgresql://${LITELLM_DB_USER}:${LITELLM_DB_PASSWORD:?required}@db:5432/${LITELLM_DB_NAME}
      - STORE_MODEL_IN_DB=True
      - UI_USERNAME=${LITELLM_ADMIN_USERNAME}
      - UI_PASSWORD=${LITELLM_ADMIN_PASSWORD:?required}
      - TZ=${TZ}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: ${LITELLM_DB_IMAGE:-postgres:16}
    container_name: litellm-postgres
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${LITELLM_DB_USER}
      - POSTGRES_PASSWORD=${LITELLM_DB_PASSWORD:?required}
      - POSTGRES_DB=${LITELLM_DB_NAME}
      - TZ=${TZ}
    volumes:
      - ${LITELLM_DB_DATA_PATH}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${LITELLM_DB_USER}", "-d", "${LITELLM_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 10
